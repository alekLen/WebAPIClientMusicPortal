<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Testing music portal</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.0/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-2.2.0.min.js"></script>
</head>
<body>
    <div style="width:100%;text-align:center"><h1>Testing music portal</h1></div>
    <div style="display:flex; justify-content:space-around">
        <div>
            <h2>List of songs</h2>
            <table class="table table-condensed table-striped ">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th style="width:220px">Name</th>
                        <th style="width:150px">Atist</th>
                        <th style="width:100px">Genre</th>
                        <th>Year</th>
                        <th style="width:220px">Album</th>

                        <th style="width:150px"></th>
                    </tr>
                </thead>
                <tbody id="songs"></tbody>
            </table>
        </div>
        <div>
            <h3>The Song</h3>
            <form name="formSong">
                <input type="hidden" name="songId" value="0" />
                <div class="form-group">
                    <label>Name</label>
                    <input class="form-control" name="songname" />
                </div>
                <div class="form-group ">
                    <label>Artist</label>
                    <input class="form-control" name="artistName" />
                </div>
                <div class="form-group ">
                    <label>Genre</label>
                    <input class="form-control" name="genre" />
                </div>
                <div class="form-group ">
                    <label>Year</label>
                    <input class="form-control" name="year" />
                </div>
                <div class="form-group ">
                    <label>Album</label>
                    <input class="form-control" name="album" />
                </div> <div class="form-group ">
                    <label>Text</label><br />
                    <textarea name="text"></textarea>
                </div>
                <div class="form-group ">
                    <label>File</label>
                    <input class="form-control" name="file" />
                </div>
                <div class="panel-body">
                    <a id="saveSong" class="btn btn-primary" style="color:white">Save</a>
                    <a id="cancelSong" class="btn btn-primary" style="color:white">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <hr />
    <div style="display:flex; justify-content:space-around">
        <div>
            <h2>List of artists</h2>
            <table class="table table-condensed table-striped ">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th style="width:250px">Name</th>
                        <th style="width:250px">Photo</th>
                        <th style="width:150px"></th>
                    </tr>
                </thead>
                <tbody id="artists"></tbody>
            </table>
        </div>
        <div>
            <h3>The Artist</h3>
            <form name="formArtist">
                <input type="hidden" name="artistId" value="0" />
                <div class="form-group">
                    <label>Name</label>
                    <input class="form-control" name="Artist_Name" />
                </div>
                <div class="form-group ">
                    <label>Artist</label>
                    <input class="form-control" name="Artist_Photo" />
                </div>
                <div class="panel-body">
                    <a id="saveArtist" class="btn btn-primary" style="color:white">Save</a>
                    <a id="cancelArtist" class="btn btn-primary" style="color:white">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <hr />
    <div style="display:flex; justify-content:space-around">
        <div>
            <h2>List of users</h2>
            <table class="table table-condensed table-striped ">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th style="width:250px">Name</th>
                        <th>Age</th>
                        <th style="width:250px">Email</th>
                        <th>Level</th>
                        <th style="width:150px"></th>
                    </tr>
                </thead>
                <tbody id="users"></tbody>
            </table>
        </div>
        <div>
            <h3>The User</h3>
            <form name="formUser">
                <input type="hidden" name="userId" value="0" />
                <div class="form-group">
                    <label>Login</label>
                    <input class="form-control" name="User_Name"  />
                </div>
                <div class="form-group ">
                    <label>Password</label>
                    <input class="form-control" name="Password"  />
                </div>
                <div class="form-group ">
                    <label>Age</label>
                    <input class="form-control" name="Age"  />
                </div>
                <div class="form-group ">
                    <label>Email</label>
                    <input class="form-control" name="Email"  />
                </div>
                <div class="form-group ">
                    <label>Level</label>
                    <input type="number" class="form-control" name="Level" max="2" min="0" />
                </div>
                <div class="panel-body">
                    <a id="addUser" class="btn btn-primary" style="color:white">Add</a>
                    <a id="saveUser" class="btn btn-primary" style="color:white">Edit</a>
                    <a id="cancelUser" class="btn btn-primary" style="color:white">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <script>

        // загрузка песен
        GetSongs();
        GetArtists();  //загрузка исполнителей
        GetUsers();   //загрука пользователей
        // Получение всех песен
        function GetSongs() {
            $.ajax({
                url: 'https://localhost:7249/api/song',
                method: "GET",
                contentType: "application/json",
                success: function (songs) {

                    var rows = "";
                    $.each(songs, function (index, song) {
                        // добавляем полученные элементы в таблицу
                        rows += rowS(song);
                    })
                    $("#songs").append(rows);
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            });
        }
        var rowS = function (song) {
            return "<tr data-rowidS='" + song.id + "'><td>" + song.id + "</td>" +
                "<td>" + song.name + "</td> <td>" + song.artist.name + "</td>" +
                "<td>" + song.style.name + "</td> <td>" + song.year + "</td>" +
                "<td>" + song.album + "</td> " +
                "<td><a class='editSong' data-id='" + song.id + "'>Edit</a> | " +
                "<a class='removeSong' data-id='" + song.id + "'>Delete</a></td></tr>";
        };
        function GetArtists() {
            $.ajax({
                url: 'https://localhost:7249/api/artist',
                method: "GET",
                contentType: "application/json",
                success: function (artists) {

                    var rows = "";
                    $.each(artists, function (index, artist) {
                        // добавляем полученные элементы в таблицу
                        rows += rowA(artist);
                    })
                    $("#artists").append(rows);
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            });
        }
        var rowA = function (artist) {
            return "<tr data-rowidA='" + artist.id + "'><td>" + artist.id + "</td>" +
                "<td>" + artist.name + "</td> <td>" + artist.photo + "</td>" +
                "<td><a class='editArtist' data-id='" + artist.id + "'>Edit</a> | " +
                "<a class='removeArtist' data-id='" + artist.id + "'>Delete</a></td></tr>";
        };
        function GetUsers() {
            $.ajax({
                url: 'https://localhost:7249/api/user',
                method: "GET",
                contentType: "application/json",
                success: function (users) {

                    var rows = "";
                    $.each(users, function (index, user) {
                        // добавляем полученные элементы в таблицу
                        rows += rowU(user);
                    })
                    $("#users").append(rows);
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            });
        }
        var rowU = function (user) {
            return "<tr data-rowidU='" + user.id + "'><td>" + user.id + "</td>" +
                "<td>" + user.name + "</td> <td>" + user.age + "</td>" +
                "<td>" + user.email + "</td> <td>" + user.level + "</td>" +               
                "<td><a class='editUser' data-id='" + user.id + "'>Edit</a> | " +
                "<a class='removeUser' data-id='" + user.id + "'>Delete</a></td></tr>";
        };
        $("body").on("click", ".editSong", function () {
            var id = $(this).data("id");
            GetSong(id);
        });
        function GetSong(id) {
            $.ajax({
                url: 'https://localhost:7249/api/song/' + id,
                method: 'GET',
                contentType: "application/json",
                success: function (song) {
                    var form = document.forms["formSong"];
                    form.elements["songId"].value = song.id;
                    form.elements["songname"].value = song.name;
                    form.elements["artistName"].value = song.artist.name;
                    form.elements["genre"].value = song.style.name;
                    form.elements["year"].value = song.year;
                    form.elements["album"].value = song.album;
                    form.elements["text"].value = song.text;
                    form.elements["file"].value = song.file;
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            });
        }
        function EditSong(songId, songName, songArtyist, songStyle, songYear,songAlbum,songText,songFile) {
            let request = JSON.stringify({
                id: songId,
                name: songName,
                artist: songArtyist,
                style: songStyle,
                year: songYear,
                album: songAlbum,
                text: songText,
                file: songFile
            });
            $.ajax({
                url: "https://localhost:7249/api/song",
                contentType: "application/json",
                method: "PUT",
                data: request,
                success: function (song) {
                    $("tr[data-rowidS='" + song.id + "']").replaceWith(rowS(song));
                    var form = document.forms["formSong"];
                    form.reset();
                    form.elements["songId"].value = 0;
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            })
        }
        $("#saveSong").click(function (e) {
            e.preventDefault();
            var form = document.forms["formSong"];
            var id=form.elements["songId"].value;
            var name = form.elements["songname"].value;
            var artist=form.elements["artistName"].value;
            var style=form.elements["genre"].value ;
            var year=form.elements["year"].value;
           var album= form.elements["album"].value;
            var text=form.elements["text"].value;
            var file=form.elements["file"].value;
            if (id == 0)
                CreateSong(name, artist, style, year, album, text, file);
            else
                EditSong(id, name, artist, style, year, album, text, file);
        });
        function CreateSong(songName, songArtyist, songStyle, songYear, songAlbum, songText, songFile) {
            $.ajax({
                url: "https://localhost:7249/api/song",
                contentType: "application/json",
                method: "POST",
                data: JSON.stringify({
                    name: songName,
                    artist: songArtyist,
                    style: songStyle,
                    year: songYear,
                    album: songAlbum,
                    text: songText,
                    file: songFile
                }),
                success: function (song) {
                    $("#songs").append(rowS(song));
                    var form = document.forms["formSong"];
                    form.reset();
                    form.elements["songId"].value = 0;
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            })
        }
        $("#cancelSong").click(function (e) {
            e.preventDefault();
            var form = document.forms["formSong"];
            form.reset();
            form.elements["songId"].value = 0;
        });
        $("body").on("click", ".removeSong", function () {
            var id = $(this).data("id");
            DeleteSong(id);
        });
        function DeleteSong(id) {
            if (!confirm("Do you want to delete the song?"))
                return;
            $.ajax({
                url: "https://localhost:7249/api/song/" + id,
                contentType: "application/json",
                method: "DELETE",
                success: function (student) {
                    $("tr[data-rowidS='" + student.id + "']").remove();
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            })
        }
        $("body").on("click", ".editArtist", function () {
            var id = $(this).data("id");
            GetArtist(id);
        });
        function GetArtist(id) {
            $.ajax({
                url: 'https://localhost:7249/api/artist/' + id,
                method: 'GET',
                contentType: "application/json",
                success: function (artist) {
                    var form = document.forms["formArtist"];
                    form.elements["artistId"].value = artist.id;
                    form.elements["Artist_Name"].value = artist.name;
                    form.elements["Artist_Photo"].value = artist.photo;                   
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            });
        }
        function EditArtist(artistId, artistName,artistPhoto) {
            let request = JSON.stringify({
                id: artistId,
                name: artistName,
                photo:artistPhoto
            });
            $.ajax({
                url: "https://localhost:7249/api/artist",
                contentType: "application/json",
                method: "PUT",
                data: request,
                success: function (artist) {
                    $("tr[data-rowidA='" + artist.id + "']").replaceWith(rowA(artist));
                    var form = document.forms["formArtist"];
                    form.reset();
                    form.elements["artistId"].value = 0;
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            })
        }
        $("#saveArtist").click(function (e) {
            e.preventDefault();
            var form = document.forms["formArtist"];
            var id=form.elements["artistId"].value ;
           var name= form.elements["Artist_Name"].value ;
           var photo= form.elements["Artist_Photo"].value ;   
            if (id == 0)
                CreateArtist(name,photo);
            else
                EditArtist(id, name,photo);
        });
        function CreateArtist(artistName, artistPhoto) {
            $.ajax({
                url: "https://localhost:7249/api/artist",
                contentType: "application/json",
                method: "POST",
                data: JSON.stringify({
                    name: artistName,
                    photo: artistPhoto                   
                }),
                success: function (artist) {
                    $("#artists").append(rowA(artist));
                    var form = document.forms["formArtist"];
                    form.reset();
                    form.elements["artistId"].value = 0;
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            })
        }
        $("#cancelArtist").click(function (e) {
            e.preventDefault();
            var form = document.forms["formArtist"];
            form.reset();
            form.elements["artistId"].value = 0;
        });
        $("body").on("click", ".removeArtist", function () {
            var id = $(this).data("id");
            DeleteArtist(id);
        });
        function DeleteArtist(id) {
            if (!confirm("Do you want to delete the artist?"))
                return;
            $.ajax({
                url: "https://localhost:7249/api/artist/" + id,
                contentType: "application/json",
                method: "DELETE",
                success: function (artist) {
                    $("tr[data-rowidA='" + artist.id + "']").remove();
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            })
        }
        $("body").on("click", ".editUser", function () {
            var id = $(this).data("id");
            GetUser(id);
        });
        function GetUser(id) {
            $.ajax({
                url: 'https://localhost:7249/api/user/' + id,
                method: 'GET',
                contentType: "application/json",
                success: function (user) {
                    var form = document.forms["formUser"];
                    form.elements["userId"].value = user.id;
                    form.elements["User_Name"].value = user.name;
                    form.elements["Email"].value = user.email;
                    form.elements["Age"].value = user.age;
                    form.elements["Level"].value = user.level;
                    form.elements["Password"].value = user.password;
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            });
        }
        function EditUser(userId, Level, userName, userAge, userEmail, userPassword) {
            $.ajax({
                url: "https://localhost:7249/api/user",
                contentType: "application/json",
                method: "PUT",
                data: JSON.stringify({
                    id:userId,
                    name: userName,
                    email: userEmail,
                    age: userAge,
                    password: userPassword,
                    level: Level
                }),
                success: function (user) {
                    $("tr[data-rowidU='" + user.id + "']").replaceWith(rowU(user));
                    var form = document.forms["formUser"];
                    form.reset();
                    form.elements["userId"].value = 0;
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            })
        }
        $("#saveUser").click(function (e) {
            e.preventDefault();
            var form = document.forms["formUser"];
            var id = form.elements["userId"].value;           
            var level = form.elements["Level"].value;
            var name = form.elements["User_Name"].value;
            var age = form.elements["Age"].value;
            var email = form.elements["Email"].value;
            var password = form.elements["Password"].value;
            if (id == 0) { }
            else
                EditUser(id, level, name, age, email, password);
        });
        $("#addUser").click(function (e) {
            e.preventDefault();
            var form = document.forms["formUser"];
            var id = form.elements["userId"].value;
            var name = form.elements["User_Name"].value;
            var age = form.elements["Age"].value;
            var email = form.elements["Email"].value;
            var password = form.elements["Password"].value;
            if (id!=0) { }
            else
                CreateUser(name,age,email,password);
        });
        function CreateUser(userName, userAge, userEmail,userPassword) {
            $.ajax({
                url: "https://localhost:7249/api/user",
                contentType: "application/json",
                method: "POST",
                data: JSON.stringify({
                    name: userName,
                    email: userEmail,
                    age: userAge,
                    password:userPassword                   
                }),
                success: function (user) {
                    $("#users").append(rowU(user));
                    var form = document.forms["formUser"];
                    form.reset();
                    form.elements["userId"].value = 0;
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            })
        }
        $("#cancelUser").click(function (e) {
            e.preventDefault();
            var form = document.forms["formUser"];
            form.reset();
            form.elements["userId"].value = 0;
        });
        $("body").on("click", ".removeUser", function () {
            var id = $(this).data("id");
            DeleteUser(id);
        });
        function DeleteUser(id) {
            if (!confirm("Do you want to delete the user?"))
                return;
            $.ajax({
                url: "https://localhost:7249/api/user/" + id,
                contentType: "application/json",
                method: "DELETE",
                success: function (user) {
                    $("tr[data-rowidU='" + user.id + "']").remove();
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            })
        }
    </script>

</body>
</html>
