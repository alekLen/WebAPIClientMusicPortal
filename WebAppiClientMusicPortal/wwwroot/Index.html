<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Список студентов</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.0/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-2.2.0.min.js"></script>
</head>
<body>
    <div style="width:100%;text-align:center"><h1>Testing music portal</h1></div>
    <div style="display:flex; justify-content:space-around">
        <div>
            <h2>List of songs</h2>
            <table class="table table-condensed table-striped ">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th style="width:220px">Name</th>
                        <th style="width:150px">Atist</th>
                        <th style="width:100px">Genre</th>
                        <th>Year</th>
                        <th style="width:220px">Album</th>

                        <th style="width:150px"></th>
                    </tr>
                </thead>
                <tbody id="songs"></tbody>
            </table>
        </div>
        <div>
            <h3>The Song</h3>
            <form name="formSong">
                <input type="hidden" name="songId" value="0" />
                <div class="form-group">
                    <label>Name</label>
                    <input class="form-control" name="songname" />
                </div>
                <div class="form-group ">
                    <label>Artist</label>
                    <input class="form-control" name="artistName" />
                </div>
                <div class="form-group ">
                    <label>Genre</label>
                    <input class="form-control" name="genre" />
                </div>
                <div class="form-group ">
                    <label>Year</label>
                    <input class="form-control" name="year" />
                </div>
                <div class="form-group ">
                    <label>Album</label>
                    <input class="form-control" name="album" />
                </div> <div class="form-group ">
                    <label>Text</label><br />
                    <textarea name="text"></textarea>
                </div>
                <div class="form-group ">
                    <label>File</label>
                    <input class="form-control" name="file" />
                </div>
                <div class="panel-body">
                    <a id="saveSong" class="btn btn-primary" style="color:white">Save</a>
                    <a id="cancelSong" class="btn btn-primary" style="color:white">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <hr />
    <div style="display:flex; justify-content:space-around">
        <div>
            <h2>List of artists</h2>
            <table class="table table-condensed table-striped ">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th style="width:250px">Name</th>
                        <th style="width:250px">Photo</th>
                        <th style="width:150px"></th>
                    </tr>
                </thead>
                <tbody id="artists"></tbody>
            </table>
        </div>
        <div>
            <h3>The Artist</h3>
            <form>
                <input type="hidden" name="artistId" value="0" />
                <div class="form-group">
                    <label>Name</label>
                    <input class="form-control" name="Artist_Name" />
                </div>
                <div class="form-group ">
                    <label>Artist</label>
                    <input class="form-control" name="Artist_Photo" />
                </div>
                <div class="panel-body">
                    <a id="saveArtist" class="btn btn-primary" style="color:white">Save</a>
                    <a id="cancelArtist" class="btn btn-primary" style="color:white">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <hr />
    <div style="display:flex; justify-content:space-around">
        <div>
            <h2>List of users</h2>
            <table class="table table-condensed table-striped ">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th style="width:250px">Name</th>
                        <th>Age</th>
                        <th style="width:250px">Email</th>
                        <th>Level</th>
                        <th style="width:150px"></th>
                    </tr>
                </thead>
                <tbody id="users"></tbody>
            </table>
        </div>
        <div>
            <h3>The User</h3>
            <form>
                <input type="hidden" name="userId" value="0" />
                <div class="form-group">
                    <label>Name</label>
                    <input class="form-control" name="User_Name" />
                </div>
                <div class="form-group ">
                    <label>Age</label>
                    <input class="form-control" name="Age" />
                </div>
                <div class="form-group ">
                    <label>Email</label>
                    <input class="form-control" name="Email" />
                </div>
                <div class="form-group ">
                    <label>Level</label>
                    <input class="form-control" name="Level" />
                </div>
                <div class="panel-body">
                    <a id="saveUser" class="btn btn-primary" style="color:white">Save</a>
                    <a id="cancelUser" class="btn btn-primary" style="color:white">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <script>

        // загрузка песен
        GetSongs();
        GetArtists();  //загрузка исполнителей
        GetUsers();   //загрука пользователей
        // Получение всех песен
        function GetSongs() {
            $.ajax({
                url: 'https://localhost:7249/api/song',
                method: "GET",
                contentType: "application/json",
                success: function (songs) {

                    var rows = "";
                    $.each(songs, function (index, song) {
                        // добавляем полученные элементы в таблицу
                        rows += rowS(song);
                    })
                    $("#songs").append(rows);
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            });
        }
        var rowS = function (song) {
            return "<tr data-rowid='" + song.id + "'><td>" + song.id + "</td>" +
                "<td>" + song.name + "</td> <td>" + song.artist.name + "</td>" +
                "<td>" + song.style.name + "</td> <td>" + song.year + "</td>" +
                "<td>" + song.album + "</td> " +
                "<td><a class='editSong' data-id='" + song.id + "'>Edit</a> | " +
                "<a class='removeSong' data-id='" + song.id + "'>Delete</a></td></tr>";
        };
        function GetArtists() {
            $.ajax({
                url: 'https://localhost:7249/api/artist',
                method: "GET",
                contentType: "application/json",
                success: function (artists) {

                    var rows = "";
                    $.each(artists, function (index, artist) {
                        // добавляем полученные элементы в таблицу
                        rows += rowA(artist);
                    })
                    $("#artists").append(rows);
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            });
        }
        var rowA = function (artist) {
            return "<tr data-rowid='" + artist.id + "'><td>" + artist.id + "</td>" +
                "<td>" + artist.name + "</td> <td>" + artist.photo + "</td>" +
                "<td><a class='editArtist' data-id='" + artist.id + "'>Edit</a> | " +
                "<a class='removeArtist' data-id='" + artist.id + "'>Delete</a></td></tr>";
        };
        function GetUsers() {
            $.ajax({
                url: 'https://localhost:7249/api/user',
                method: "GET",
                contentType: "application/json",
                success: function (users) {

                    var rows = "";
                    $.each(users, function (index, user) {
                        // добавляем полученные элементы в таблицу
                        rows += rowU(user);
                    })
                    $("#users").append(rows);
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            });
        }
        var rowU = function (user) {
            return "<tr data-rowid='" + user.id + "'><td>" + user.id + "</td>" +
                "<td>" + user.name + "</td> <td>" + user.age + "</td>" +
                "<td>" + user.email + "</td> <td>" + user.level + "</td>" +
                "<td><a class='editUser' data-id='" + user.id + "'>Edit</a> | " +
                "<a class='removeUser' data-id='" + user.id + "'>Delete</a></td></tr>";
        };
        $("body").on("click", ".editSong", function () {
            var id = $(this).data("id");
            GetSong(id);
        });
        function GetSong(id) {
            $.ajax({
                url: 'https://localhost:7249/api/song/' + id,
                method: 'GET',
                contentType: "application/json",
                success: function (song) {
                    var form = document.forms["formSong"];
                    form.elements["songId"].value = song.id;
                    form.elements["songname"].value = song.name;
                    form.elements["artistName"].value = song.artist.name;
                    form.elements["genre"].value = song.style.name;
                    form.elements["year"].value = song.year;
                    form.elements["album"].value = song.album;
                    form.elements["text"].value = song.text;
                    form.elements["file"].value = song.file;
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            });
        }
        function EditSong(songId, songName, songArtyist, songStyle, songYear,songAlbum,songText,songFile) {
            let request = JSON.stringify({
                id: songId,
                name: songName,
                artist: songArtyist,
                style: songStyle,
                year: songYear,
                album: songAlbum,
                text: songText,
                file: songFile
            });
            $.ajax({
                url: "https://localhost:7249/api/song",
                contentType: "application/json",
                method: "PUT",
                data: request,
                success: function (song) {
                    $("tr[data-rowid='" + song.id + "']").replaceWith(rowS(song));
                    var form = document.forms["formSong"];
                    form.reset();
                    form.elements["songId"].value = 0;
                },
                error: function (x, y, z) {
                    alert(x + '\n' + y + '\n' + z);
                }
            })
        }
    </script>

</body>
</html>
